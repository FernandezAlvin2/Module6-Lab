<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="page">
    <div class="form-card">

        <h1>Student Registration</h1>
        <p class="intro">Please complete all required information.</p>

        <form id="registrationForm" novalidate>

            <div class="field">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    aria-describedby="fullNameError"
                    aria-invalid="false"
                >
                <div id="fullNameError" class="error"></div>
            </div>

            <div class="field">
                <label for="studentNumber">Student Number</label>
                <input
                    type="text"
                    id="studentNumber"
                    name="studentNumber"
                    placeholder="24-1234-123"
                    required
                    aria-describedby="studentNumberError"
                    aria-invalid="false"
                >
                <div id="studentNumberError" class="error"></div>
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    aria-describedby="emailError"
                    aria-invalid="false"
                >
                <div id="emailError" class="error"></div>
            </div>

            <div class="field">
                <label for="mobileNumber">Mobile Number</label>
                <input
                    type="tel"
                    id="mobileNumber"
                    name="mobileNumber"
                    placeholder="09171234567"
                    required
                    aria-describedby="mobileNumberError"
                    aria-invalid="false"
                >
                <div id="mobileNumberError" class="error"></div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    aria-describedby="passwordFeedback passwordError"
                    aria-invalid="false"
                >

                <div id="passwordFeedback" class="feedback"></div>
                <div id="passwordError" class="error"></div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    aria-describedby="confirmPasswordError"
                    aria-invalid="false"
                >
                <div id="confirmPasswordError" class="error"></div>
            </div>

            <div class="field">
                <label for="course">Course</label>

                <select
                    id="course"
                    name="course"
                    required
                    aria-describedby="courseError"
                    aria-invalid="false"
                >
                    <option value="">Select your course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                </select>

                <div id="courseError" class="error"></div>
            </div>

            <div class="terms-box">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                    aria-describedby="termsError"
                    aria-invalid="false"
                >

                <label for="terms">
                    I agree to the terms and conditions.
                </label>

                <div id="termsError" class="error"></div>
            </div>

            <div class="button-row">
                <button type="submit" id="registerBtn">
                    Register
                </button>

                <button type="reset" id="resetBtn">
                    Reset
                </button>
            </div>

        </form>

        <div
            id="successMessage"
            class="success"
            role="status"
            aria-live="polite"
        ></div>

        <section id="registrationSummary" class="summary" hidden>

            <h2>Registration Summary</h2>

            <div class="summary-row">
                <strong>Full Name:</strong>
                <span id="summaryName"></span>
            </div>

            <div class="summary-row">
                <strong>Student Number:</strong>
                <span id="summaryStudentNumber"></span>
            </div>

            <div class="summary-row">
                <strong>Email:</strong>
                <span id="summaryEmail"></span>
            </div>

            <div class="summary-row">
                <strong>Mobile Number:</strong>
                <span id="summaryMobileNumber"></span>
            </div>

            <div class="summary-row">
                <strong>Course:</strong>
                <span id="summaryCourse"></span>
            </div>

        </section>

    </div>
</main>

<script src="js/app.js"></script>

</body>
</html>
